# Mosquitto configuration — Lab 3 optional TLS extension.
# Only loaded when the stack is brought up with docker-compose.tls.yml, and
# only works once certs/gen-certs.sh has been run — see the README.

persistence false
log_dest stdout
log_type error
log_type warning
log_type notice

per_listener_settings true

listener 1883
allow_anonymous true

listener 8883
allow_anonymous true
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
