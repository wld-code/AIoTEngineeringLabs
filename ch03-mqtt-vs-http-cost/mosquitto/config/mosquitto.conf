# Mosquitto configuration — Lab 3 (protocol-cost comparison), base stack.
#
# Lab-only: anonymous access, plaintext. This measures the two application
# protocols on equal footing first. The optional TLS extension (see the
# lab's README) uses a completely separate config in mosquitto/config-tls/
# and a docker-compose override — it never touches this file, so the base
# lab never depends on a certificate existing. Chapter 4 covers a hardened,
# mutual-TLS broker end to end.

persistence false
log_dest stdout
log_type error
log_type warning
log_type notice

listener 1883
allow_anonymous true
