# Mosquitto configuration — Lab 1
# Lab-only: anonymous access enabled. Production deployments require TLS,
# X.509 certificates, and ACLs. Chapter 4 covers a hardened broker setup.

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# MQTT (TCP)
listener 1883
allow_anonymous true

# MQTT over WebSockets — useful when a browser-side client needs to connect
listener 9001
protocol websockets
allow_anonymous true
