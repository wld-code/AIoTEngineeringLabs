; PlatformIO project file — lets you build/flash/monitor this ESP-IDF
; project with `pio` instead of installing and activating raw ESP-IDF
; (no `idf.py`, no `. export.sh` needed). See the lab README for setup.
[platformio]
src_dir = main

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = espidf
monitor_speed = 115200
