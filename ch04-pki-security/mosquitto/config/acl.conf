# use_identity_as_username turns the cert's CN into the MQTT username (%u),
# so each device is confined to its own topic tree — no explicit deny rule
# is needed for cross-device access: acl_file defaults to deny-all, and a
# device's own pattern never matches another device's topic.
#
# One pattern per subtree (telemetry, commands) rather than one pattern for
# the whole devices/%u/# tree, so the tutorial can extend either subtree
# independently later (e.g. read-only commands for devices, write-only
# telemetry for a future non-device identity) without touching the other.
#
# readwrite on both subtrees lets a single device identity exercise both
# directions of the trust boundary in Part 8's authorization test, without
# needing a second, platform-side identity in the mix. This is a lab
# simplification, not the production recommendation.
#
# A device only ever needs to publish telemetry and receive commands, never
# the reverse of either. A least-privilege production policy would instead
# be closer to:
#
#   pattern write devices/%u/telemetry/#
#   pattern read  devices/%u/commands/#
#
# Chapter 4 (4.4) describes this finer publish/subscribe split as the
# production pattern.
pattern readwrite devices/%u/telemetry/#
pattern readwrite devices/%u/commands/#
