# Lab 4 Mosquitto configuration — mutual TLS over a two-level PKI, with
# revocation enforced on every handshake.

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

listener 8883
protocol mqtt

# cafile is the *chain* — intermediate + root. Mosquitto needs the
# intermediate to validate a device cert (issued by the intermediate) and
# the root to validate the intermediate itself. Give it only the root and
# every device handshake fails with "unable to get local issuer certificate".
# cafile validates *incoming* client certs. certfile is what the broker
# *presents* to clients — its own leaf plus the intermediate that issued
# it, so a client holding only the root can still build the path.
cafile   /mosquitto/certs/ca-chain.cert.pem
certfile /mosquitto/certs/broker-fullchain.cert.pem
keyfile  /mosquitto/certs/broker.key.pem

require_certificate true
use_identity_as_username true
allow_anonymous false

# Per-device topic ACL — a valid client cert proves identity, not
# authorization.
acl_file /mosquitto/config/acl.conf

# Checked on every handshake against every cert in the chain. A device
# whose serial appears here is refused before a single MQTT byte is
# exchanged, even though its signature, dates and chain are all still
# individually valid — this is what makes revocation different from
# expiry.
crlfile /mosquitto/certs/intermediate.crl.pem

tls_version tlsv1.3
